<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lexideck — повторение</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="review-page.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Lexideck</h1>
        <nav aria-label="Основная навигация">
          <a href="review.html" aria-current="page">Повторение</a>
          <a href="vocabulary.html">Словарь</a>
          <a href="settings.html">Настройки</a>
        </nav>
      </header>
      <section id="review" aria-labelledby="review-heading">
        <h2 id="review-heading">Повторение</h2>
        <p id="study-streak" aria-live="polite">Серия занятий: 0 дней</p>
        <details id="study-achievement-details">
          <summary>Достижения</summary>
          <ul id="study-achievements"></ul>
        </details>
        <button id="start-review" type="button">Начать занятие</button>
        <progress id="review-progress-bar" aria-label="Прогресс занятия" value="0" max="1" hidden></progress>
        <p id="review-progress" role="status" aria-live="polite">Занятие ещё не начато.</p>
        <p id="review-status" role="status" tabindex="-1"></p>
        <article id="review-card" hidden>
          <h3 id="review-headword"></h3>
          <button id="show-answer" type="button">Показать ответ</button>
          <div id="review-answer" tabindex="-1" hidden>
            <p id="review-meaning"></p>
            <h4>Контекст употребления</h4>
            <ul id="review-contexts"></ul>
            <h4>Примеры модели</h4>
            <ul id="review-examples"></ul>
            <div id="review-ratings">
              <button type="button" data-rating="1">Не вспомнил</button>
              <button type="button" data-rating="2">Трудно</button>
              <button type="button" data-rating="3">Хорошо</button>
              <button type="button" data-rating="4">Легко</button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
