<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lexideck — перевод</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Lexideck</h1>
        <button id="settings-toggle" class="subtle" type="button" aria-expanded="false">Настройки API</button>
      </header>

      <section id="settings" hidden>
        <h2>Языки и API</h2>
        <label>Исходный язык<input id="source-language" value="English" autocomplete="off"></label>
        <label>Язык перевода<input id="target-language" value="Русский" autocomplete="off"></label>
        <label>URL API<input id="api-url" type="url" placeholder="https://api.example.com/v1" autocomplete="url"></label>
        <label>Идентификатор модели<input id="model" autocomplete="off" placeholder="gpt-4o-mini"></label>
        <label>Ключ API<input id="api-key" type="password" autocomplete="off"></label>
        <button id="save-settings" type="button">Сохранить настройки</button>
        <p id="settings-status" role="status"></p>
      </section>

      <section>
        <label for="source-text">Текст для перевода</label>
        <textarea id="source-text" rows="5" placeholder="Выделите текст на странице или введите его здесь"></textarea>
        <button id="save-expression" type="button" disabled>Сохранить выделенное выражение</button>
        <form id="expression-form" hidden>
          <p>Выражение: <strong id="expression-text"></strong></p>
          <label for="expression-meaning">Значение</label>
          <input id="expression-meaning" required>
          <button type="submit">Сохранить выражение</button>
          <button id="cancel-expression" class="subtle" type="button">Отмена</button>
        </form>
        <p id="comic-status" role="status"></p>
        <button id="translate" type="button">Подтвердить текст и перевести</button>
        <p id="error" role="alert"></p>
      </section>

      <section id="result" aria-live="polite" hidden>
        <h2>Перевод</h2>
        <p id="sentence-translation"></p>
        <h2>Слова по порядку</h2>
        <ol id="word-meanings"></ol>
      </section>
      <section id="review" aria-labelledby="review-heading">
        <h2 id="review-heading">Повторение</h2>
        <form id="review-settings">
          <label>Новых карточек в день<input id="new-card-limit" type="number" min="0" step="1" value="10" required></label>
          <button type="submit">Сохранить лимит</button>
        </form>
        <p id="review-settings-status" role="status"></p>
        <button id="start-review" type="button">Начать занятие</button>
        <p id="review-status" role="status"></p>
        <article id="review-card" hidden>
          <h3 id="review-headword"></h3>
          <button id="show-answer" type="button">Показать ответ</button>
          <div id="review-answer" hidden>
            <p id="review-meaning"></p>
            <h4>Контекст употребления</h4>
            <ul id="review-contexts"></ul>
            <h4>Примеры модели</h4>
            <ul id="review-examples"></ul>
            <div id="review-ratings">
              <button type="button" data-rating="1">Не вспомнил</button>
              <button type="button" data-rating="2">Трудно</button>
              <button type="button" data-rating="3">Хорошо</button>
              <button type="button" data-rating="4">Легко</button>
            </div>
          </div>
        </article>
      </section>
      <section id="vocabulary">
        <h2>Словарь</h2>
        <p id="vocabulary-empty">Пока нет сохранённых карточек.</p>
        <div id="vocabulary-cards"></div>
      </section>
    </main>
  </body>
</html>
